          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGPASSWORD: ci
      CI_SUPERUSER: supabase_admin
      ZELL_CI_DISPOSABLE_DB: 'yes'
    steps:
