name: CI

# التحقق من البناء. مفيش نشر ولا دمج ولا أي وصول لقاعدة بيانات.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: install + typecheck + build
    runs-on: ubuntu-latest

    # قراءة فقط — الـ workflow مالوش أي صلاحية كتابة على الريبو
    permissions:
      contents: read

    # مصدر بيانات صريح للمتجر: الـ CI بيبني بالكتالوج المؤقت ومابيلمسش Supabase.
    env:
      STOREFRONT_DATA_SOURCE: fallback

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # frozen: أي اختلاف بين pnpm-lock.yaml و package.json بيفشل البناء
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck core
        run: pnpm --filter @zell/core typecheck

      - name: Typecheck storefront
        run: pnpm --filter @zell/storefront typecheck

      - name: Build storefront
        run: pnpm --filter @zell/storefront build

      # لوحة التحكم بتتبني في CI بس **ما بتتنشرش** — مشروع Vercel
      # مربوط على apps/storefront فقط.
      - name: Typecheck admin
        run: pnpm --filter @zell/admin typecheck

      # حالات المنطق الخالص للوحة (0020-UI) — بتتشغّل فعليًا، من غير داتابيز ولا شبكة.
      - name: Admin cases
        run: pnpm --filter @zell/admin cases

      # 0021-P (ب1) — فاحص الحراس: اختبار ذاتي، وتقرير على اللوحة كلها (مابيفشلش لحد ب2)،
      # وقايمة الصلاحيات في الكود = catalog الداتابيز. العقد: docs/contracts/0021-P-code.md §٥–٦.
      - name: "0021-P: access checker selftest"
        run: node apps/admin/scripts/check-access.selftest.mjs

      - name: "0021-P: access checker (whole admin, report)"
        run: node apps/admin/scripts/check-access.mjs --root apps/admin --mode report

      - name: "0021-P: capabilities = SQL catalog"
        run: node apps/admin/scripts/check-capabilities.mjs

      - name: Build admin
        run: pnpm --filter @zell/admin build

  # 0021-P — job منفصل جوه نفس الـ workflow: بيشتغل لما ملفات 0021-P تتغيّر بس (غير كده بيظهر skipped).
  sql-0021p-changes:
    name: "sql 0021-P: detect changes"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect 0021-P SQL changes
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$EVENT" = "pull_request" ]; then range="$BASE_SHA...HEAD"; else range="$BEFORE_SHA..HEAD"; fi
          if ! changed=$(git diff --name-only "$range" 2>/dev/null); then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if printf '%s\n' "$changed" | grep -Eq '^(backend/db/migrations/0021p_|backend/db/ci/0021p_|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # Postgres 17 مؤقت (Production ≥ 17 حسب preflight 0020). مفيش أي اتصال بـ Supabase.
  # كلمة السر دي لحاوية مؤقتة بتتمسح مع نهاية الـ job.
  sql-0021p:
    name: "sql 0021-P: ptest + apply + verify + rollback + concurrency (postgres 17)"
    needs: sql-0021p-changes
    if: needs.sql-0021p-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGPASSWORD: ci
      CI_SUPERUSER: supabase_admin
      ZELL_CI_DISPOSABLE_DB: 'yes'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: psql client
        run: psql --version

      - name: Engine / adapter boundaries
        run: bash backend/db/ci/0021p_boundaries.sh

      - name: SQL suite (two-connection concurrency included)
        run: bash backend/db/ci/0021p_sql_ci.sh
