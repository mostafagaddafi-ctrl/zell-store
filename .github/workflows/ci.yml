            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # Postgres 17 مؤقت. مفيش أي اتصال بـ Supabase. كلمة السر دي لحاوية مؤقتة بتتمسح مع نهاية الـ job.
  sql-0021ex:
    name: "sql EXPRESS-SHIPPING: ptest + apply + verify + parity + flows + rollback (postgres 17)"
    needs: sql-0021ex-changes
    if: needs.sql-0021ex-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGPASSWORD: ci
      CI_SUPERUSER: supabase_admin
      ZELL_CI_DISPOSABLE_DB: 'yes'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: psql client
        run: psql --version

      # node 22 علشان --experimental-strip-types (S46: شحن العرض من packages/core بالحرف = الداتابيز، من غير build).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: SQL suite (EXPRESS-SHIPPING on the Production shape A1 + D + P1 + P2 + D2 + TR)
        run: bash backend/db/ci/0021ex_sql_ci.sh
