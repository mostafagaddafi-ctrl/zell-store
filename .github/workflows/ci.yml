name: CI

# التحقق من البناء. مفيش نشر ولا دمج ولا أي وصول لقاعدة بيانات.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: install + typecheck + build
    runs-on: ubuntu-latest

    # قراءة فقط — الـ workflow مالوش أي صلاحية كتابة على الريبو
    permissions:
      contents: read

    # مصدر بيانات صريح للمتجر: الـ CI بيبني بالكتالوج المؤقت ومابيلمسش Supabase.
    env:
      STOREFRONT_DATA_SOURCE: fallback

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # frozen: أي اختلاف بين pnpm-lock.yaml و package.json بيفشل البناء
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck core
        run: pnpm --filter @zell/core typecheck

      - name: Typecheck storefront
        run: pnpm --filter @zell/storefront typecheck

      # 0021-D2 W2 — حالات المتجر الخالصة (إعداد موعد التسليم + مسار الطلب بداتابيز مزيّفة) — بتتشغّل فعليًا، من غير شبكة.
      - name: Storefront cases
        run: pnpm --filter @zell/storefront cases

      - name: Build storefront
        run: pnpm --filter @zell/storefront build

      # لوحة التحكم بتتبني في CI بس **ما بتتنشرش** — مشروع Vercel
      # مربوط على apps/storefront فقط.
      - name: Typecheck admin
        run: pnpm --filter @zell/admin typecheck

      # حالات المنطق الخالص للوحة (0020-UI) — بتتشغّل فعليًا، من غير داتابيز ولا شبكة.
      - name: Admin cases
        run: pnpm --filter @zell/admin cases

      # 0021-P — فاحص الحراس: اختبار ذاتي، و enforce على اللوحة كلها (أي finding = فشل — من ب2)،
      # وجدول الربط (manifest) = الكود، وقايمة الصلاحيات في الكود = catalog الداتابيز. العقد: docs/contracts/0021-P-code.md §٥–٧.
      - name: "0021-P: access checker selftest"
        run: node apps/admin/scripts/check-access.selftest.mjs

      - name: "0021-P: access checker (whole admin, enforce)"
        run: node apps/admin/scripts/check-access.mjs --root apps/admin --mode enforce

      - name: "0021-P: access manifest = code"
        run: node apps/admin/scripts/check-access-manifest.mjs --root apps/admin

      - name: "0020-S: inventory calls use the user session (no actor param, no service_role, manifest unchanged)"
        run: node apps/admin/scripts/check-inventory-session.mjs

      - name: "0021-P: capabilities = SQL catalog"
        run: node apps/admin/scripts/check-capabilities.mjs

      - name: Build admin
        run: pnpm --filter @zell/admin build

  # 0021-P — job منفصل جوه نفس الـ workflow: بيشتغل لما ملفات 0021-P تتغيّر بس (غير كده بيظهر skipped).
  sql-0021d-changes:
    name: "sql 0021-D: detect changes"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect 0021-A SQL changes
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$EVENT" = "pull_request" ]; then range="$BASE_SHA...HEAD"; else range="$BEFORE_SHA..HEAD"; fi
          if ! changed=$(git diff --name-only "$range" 2>/dev/null); then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if printf '%s\n' "$changed" | grep -Eq '^(backend/db/migrations/0021d_|backend/db/migrations/0021a_a1_order_cycle|backend/db/migrations/0019_coupons\.sql$|backend/db/ci/0021d_|backend/db/ci/0021p_txn_shape\.py$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # Postgres 17 مؤقت. مفيش أي اتصال بـ Supabase. كلمة السر دي لحاوية مؤقتة بتتمسح مع نهاية الـ job.
  sql-0021d:
    name: "sql 0021-D: ptest + apply + verify + old/new parity + rollback (postgres 17)"
    needs: sql-0021d-changes
    if: needs.sql-0021d-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGPASSWORD: ci
      CI_SUPERUSER: supabase_admin
      ZELL_CI_DISPOSABLE_DB: 'yes'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: psql client
        run: psql --version

      - name: SQL suite (old/new create_order parity matrix included)
        run: bash backend/db/ci/0021d_sql_ci.sh

  # 0021-A P1 — الدفعات ورسوم التأكيد: بيشتغل لما ملفات P1 أو اللي بيعتمد عليها تتغيّر (غير كده skipped).
  sql-0021p1-changes:
    name: "sql 0021-A P1: detect changes"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect 0021-A P1 SQL changes
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$EVENT" = "pull_request" ]; then range="$BASE_SHA...HEAD"; else range="$BEFORE_SHA..HEAD"; fi
          if ! changed=$(git diff --name-only "$range" 2>/dev/null); then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if printf '%s\n' "$changed" | grep -Eq '^(backend/db/migrations/0021a_|backend/db/migrations/0021d_|backend/db/migrations/0021p_|backend/db/migrations/0019_coupons\.sql$|backend/db/ci/0021p1_|backend/db/ops/clean_prelaunch|backend/db/ci/0021d_sql_ci\.sh$|backend/db/ci/0021p_txn_shape\.py$|packages/core/src/confirmationFee\.ts$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # Postgres 17 مؤقت. مفيش أي اتصال بـ Supabase. كلمة السر دي لحاوية مؤقتة بتتمسح مع نهاية الـ job.
  sql-0021p1:
    name: "sql 0021-A P1: ptest + apply + verify + parity (orders + fee DB = core) + flows + rollback (postgres 17)"
    needs: sql-0021p1-changes
    if: needs.sql-0021p1-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGPASSWORD: ci
      CI_SUPERUSER: supabase_admin
      ZELL_CI_DISPOSABLE_DB: 'yes'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # node 22 علشان --experimental-strip-types (حساب الرسوم من packages/core بالحرف، من غير build).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: psql client
        run: psql --version

      - name: SQL suite (create_order parity, fee DB = core, payment flows, rollback)
        run: bash backend/db/ci/0021p1_sql_ci.sh

      # مراجعة #122 B1: نفس الحزمة ومالك zell_create_order = postgres (شكل Production حسب 08-HANDOFF-NOW).
      - name: SQL suite — zell_create_order owned by postgres (Production shape)
        env:
          ZELL_P1_CO_OWNER: postgres
        run: bash backend/db/ci/0021p1_sql_ci.sh

  sql-0021a-changes:
    name: "sql 0021-A A1: detect changes"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect 0021-A SQL changes
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$EVENT" = "pull_request" ]; then range="$BASE_SHA...HEAD"; else range="$BEFORE_SHA..HEAD"; fi
          if ! changed=$(git diff --name-only "$range" 2>/dev/null); then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if printf '%s\n' "$changed" | grep -Eq '^(backend/db/migrations/0021a_|backend/db/ci/0021a_|backend/db/ci/0021p_txn_shape\.py$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # Postgres 17 مؤقت. مفيش أي اتصال بـ Supabase. كلمة السر دي لحاوية مؤقتة بتتمسح مع نهاية الـ job.
  sql-0021a:
    name: "sql 0021-A A1: ptest + apply + verify + gate + rollback (postgres 17)"
    needs: sql-0021a-changes
    if: needs.sql-0021a-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: ci
        ports:
