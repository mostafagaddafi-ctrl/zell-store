        run: psql --version

      - name: SQL suite (0021-D2 on the Production shape A1 + D + P1 + P2)
        run: bash backend/db/ci/0021d2_sql_ci.sh

  sql-0021tr-changes:
    name: "sql 0021-TR: detect changes"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
