          if ! changed=$(git diff --name-only "$range" 2>/dev/null); then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if printf '%s\n' "$changed" | grep -Eq '^(backend/db/migrations/0020|backend/db/ci/0020s_|backend/db/ci/0021p_txn_shape\.py$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # 0020-S (عقد docs/contracts/0020-S.md): Postgres 17 مؤقت + shim. مفيش أي اتصال بـ Supabase.
  # كلمة السر دي لحاوية مؤقتة بتتمسح مع نهاية الـ job.
