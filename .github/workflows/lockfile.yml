name: Lockfile (temporary)

# ⚠️ مؤقت. الغرض الوحيد: توليد pnpm-lock.yaml بعد إعلان
# server-only كاعتمادية صريحة للوحة.
# بيتشال من الفرع قبل الدمج. ci.yml الدائم ما اتلمسش.
on:
  workflow_dispatch:

jobs:
  lockfile:
    name: resolve pnpm-lock.yaml
    runs-on: ubuntu-latest

    # الفرع ده بس. ممنوع يشتغل على main مهما حصل.
    if: github.ref == 'refs/heads/chore/admin-server-only-dep'

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # نفس نسخة pnpm المثبّتة في package.json (packageManager)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # نفس نسخة Node اللي في ci.yml
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml من غير تغيير"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(admin): resolve pnpm-lock.yaml for server-only dependency"
          git push origin HEAD:chore/admin-server-only-dep
