name: Cleanup

# مؤقت: حذف الكتالوج الثابت المتقاعد. الـ workflow بيحذف نفسه كمان
# في نفس الكوميت، فمش محتاج تنظيف بعده.
#
# السبب: أداة الرفع المستخدمة مش قادرة تحذف ملفات — endpoint الحذف
# في الـ connector مابياخدش message و sha.
on:
  push:
    branches: [feat/admin-phase-b]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Remove retired files
        run: |
          CHANGED=0
          if [ -e apps/admin/lib/fallback/data.ts ]; then
            git rm -q apps/admin/lib/fallback/data.ts
            CHANGED=1
          fi
          if [ -e .github/workflows/cleanup.yml ]; then
            git rm -q .github/workflows/cleanup.yml
            CHANGED=1
          fi
          if [ "$CHANGED" = "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(admin): حذف الكتالوج الثابت المتقاعد [skip deploy]"
            git push
          else
            echo "nothing to remove"
          fi
